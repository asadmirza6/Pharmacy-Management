openapi: 3.0.3
info:
  title: Pharmacy Management System - Sales Transaction API
  description: RESTful API for sales transaction recording with automatic inventory deduction
  version: 2.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Sales
    description: Sales transaction and invoice operations

paths:
  /sales:
    get:
      summary: Get all sales transactions
      tags: [Sales]
      parameters:
        - name: start_date
          in: query
          description: Filter transactions from this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Filter transactions until this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: patient_id
          in: query
          description: Filter by customer ID
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response with transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleTransaction'

    post:
      summary: Create new sales transaction
      tags: [Sales]
      description: Records sale with line items, calculates totals, and decrements inventory atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleTransactionInput'
      responses:
        '201':
          description: Sale recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sale recorded successfully
                  data:
                    $ref: '#/components/schemas/SaleTransaction'
        '400':
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sales/{invoice_id}:
    get:
      summary: Get sale transaction by invoice ID
      tags: [Sales]
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleTransactionDetail'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    SaleTransaction:
      type: object
      properties:
        invoice_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        patient_id:
          type: integer
          nullable: true
          example: 5
        transaction_timestamp:
          type: string
          format: date-time
          example: '2024-06-23T14:30:00Z'
        subtotal:
          type: number
          format: decimal
          example: 100.00
        discount_applied:
          type: number
          format: decimal
          example: 5.00
        tax_amount:
          type: number
          format: decimal
          example: 12.00
        grand_total:
          type: number
          format: decimal
          example: 107.00
        payment_mode:
          type: string
          enum: [Cash, Card, Wallet]
          example: Card
        created_at:
          type: string
          format: date-time

    SaleTransactionDetail:
      allOf:
        - $ref: '#/components/schemas/SaleTransaction'
        - type: object
          properties:
            line_items:
              type: array
              items:
                $ref: '#/components/schemas/SaleLineItem'
            cashier_name:
              type: string
              example: John Doe
            customer_name:
              type: string
              nullable: true
              example: Jane Smith

    SaleLineItem:
      type: object
      properties:
        medicine_id:
          type: integer
          example: 1
        brand_name:
          type: string
          example: Paracetamol 500mg
        generic_name:
          type: string
          example: Acetaminophen
        quantity_sold:
          type: integer
          example: 2
        unit_price_at_sale:
          type: number
          format: decimal
          example: 8.50
        line_total:
          type: number
          format: decimal
          example: 17.00

    SaleTransactionInput:
      type: object
      required:
        - user_id
        - line_items
        - payment_mode
      properties:
        user_id:
          type: integer
          description: Cashier user ID
        patient_id:
          type: integer
          nullable: true
          description: Optional customer ID for purchase history
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - medicine_id
              - quantity
            properties:
              medicine_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
        discount_percent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          default: 0
          description: Discount percentage applied to subtotal
        tax_percent:
          type: number
          format: decimal
          minimum: 0
          default: 0
          description: Tax percentage applied after discount
        payment_mode:
          type: string
          enum: [Cash, Card, Wallet]

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string
