openapi: 3.0.3
info:
  title: Billing & Checkout API
  description: API endpoints for customer checkout processing and invoice management
  version: 1.0.0
  contact:
    name: Pharmacy System Development Team

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Billing
    description: Point-of-sale checkout and invoice operations

paths:
  /billing/checkout:
    post:
      summary: Process customer checkout
      description: |
        Process a customer sale by validating stock availability, deducting inventory,
        and generating an invoice record. This operation is atomic - all items must be
        available or the entire transaction fails.
      operationId: processCheckout
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sale completed successfully
                  data:
                    $ref: '#/components/schemas/Invoice'
        '400':
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Insufficient stock
                  message:
                    type: string
                    example: Insufficient stock for Paracetamol 500mg (available 5, requested 10)
        '500':
          $ref: '#/components/responses/ServerError'

  /billing/invoices:
    get:
      summary: List all invoices
      description: Retrieve all invoice records, optionally filtered by date range or status
      operationId: getAllInvoices
      tags:
        - Billing
      parameters:
        - name: from_date
          in: query
          description: Filter invoices from this date (ISO 8601)
          schema:
            type: string
            format: date
            example: 2026-06-01
        - name: to_date
          in: query
          description: Filter invoices until this date (ISO 8601)
          schema:
            type: string
            format: date
            example: 2026-06-30
        - name: status
          in: query
          description: Filter by payment status
          schema:
            type: string
            enum: [completed, pending, cancelled]
            example: completed
      responses:
        '200':
          description: Successful response with invoice list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    description: Number of invoices returned
                    example: 42
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '500':
          $ref: '#/components/responses/ServerError'

  /billing/invoices/{id}:
    get:
      summary: Get invoice by ID
      description: Retrieve detailed information for a specific invoice
      operationId: getInvoiceById
      tags:
        - Billing
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice UUID
          schema:
            type: string
            format: uuid
            example: b8d3e890-5678-9abc-def0-123456789012
      responses:
        '200':
          description: Successful response with invoice details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    CheckoutRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: List of items to purchase
          items:
            type: object
            required:
              - medicine_id
              - quantity
            properties:
              medicine_id:
                type: string
                format: uuid
                description: Medicine UUID from inventory
                example: a3f2c789-1234-5678-9abc-def012345678
              quantity:
                type: integer
                minimum: 1
                description: Number of units to purchase
                example: 2
        customer_name:
          type: string
          description: Customer name (optional, defaults to "Walk-in Customer")
          example: John Doe
        customer_phone:
          type: string
          description: Customer phone number (optional)
          example: +1-555-0123
        payment_method:
          type: string
          enum: [cash, card, insurance]
          default: cash
          description: Payment method used
          example: cash

    Invoice:
      type: object
      required:
        - id
        - invoice_number
        - timestamp
        - items
        - total_amount
        - payment_status
        - served_by
      properties:
        id:
          type: string
          format: uuid
          description: Unique invoice identifier
          example: b8d3e890-5678-9abc-def0-123456789012
        invoice_number:
          type: string
          description: Human-readable invoice number
          example: INV-2026-0042
        timestamp:
          type: string
          format: date-time
          description: When the sale was completed
          example: 2026-06-23T10:30:45.123Z
        items:
          type: array
          minItems: 1
          description: Items sold in this transaction
          items:
            $ref: '#/components/schemas/InvoiceItem'
        total_amount:
          type: number
          format: double
          description: Total sale amount (sum of all item subtotals)
          example: 27.00
        payment_status:
          type: string
          enum: [completed, pending, cancelled]
          description: Payment completion status
          example: completed
        payment_method:
          type: string
          description: Payment method used
          example: cash
          nullable: true
        customer_name:
          type: string
          description: Customer name or "Walk-in Customer"
          example: Walk-in Customer
          nullable: true
        customer_phone:
          type: string
          description: Customer phone number
          example: +1-555-0123
          nullable: true
        served_by:
          type: string
          description: User ID of staff member who processed the sale
          example: system

    InvoiceItem:
      type: object
      required:
        - medicine_id
        - medicine_name
        - batch_number
        - quantity
        - unit_price
        - subtotal
      properties:
        medicine_id:
          type: string
          format: uuid
          description: Medicine UUID at time of sale
          example: a3f2c789-1234-5678-9abc-def012345678
        medicine_name:
          type: string
          description: Medicine name (denormalized for audit trail)
          example: Paracetamol 500mg Tablets
        batch_number:
          type: string
          description: Batch number (denormalized for traceability)
          example: B2024-001
        quantity:
          type: integer
          minimum: 1
          description: Units sold
          example: 2
        unit_price:
          type: number
          format: double
          description: Selling price per unit at time of sale
          example: 8.50
        subtotal:
          type: number
          format: double
          description: Item total (quantity × unit_price)
          example: 17.00

  responses:
    NotFound:
      description: Invoice not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Invoice not found
              message:
                type: string
                example: No invoice found with ID b8d3e890-5678-9abc-def0-123456789012

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Failed to process checkout
              message:
                type: string
                example: Internal server error
